name: Template submission
description: Suggest a reusable Slidev template for inclusion in the registry
title: "[Template]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping grow the Slidev template ecosystem. This project curates reusable presentation workflows rather than collecting every deck. Submitting an external project does not transfer ownership or imply that its code will be copied here.
  - type: input
    id: name
    attributes:
      label: Template name
      placeholder: e.g. Paper Lab
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Distinctive value and recurring presentation job
      description: Explain the audience, information architecture, workflow, and why this is reusable beyond one talk or a color variation.
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Canonical repository or source URL
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: maintainer
    attributes:
      label: Canonical maintainer or organization
      placeholder: GitHub username or organization
    validations:
      required: true
  - type: dropdown
    id: source-type
    attributes:
      label: Preferred inclusion model
      options:
        - External listing — keep implementation and governance upstream
        - Hosted contribution — propose maintainable code for this repository
        - Unsure — maintainer should decide
    validations:
      required: true
  - type: input
    id: preview
    attributes:
      label: Representative preview or live demo URL
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: usage
    attributes:
      label: Shortest reproducible start path
      placeholder: npx degit owner/repo my-presentation
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: SPDX license identifier
      placeholder: MIT
    validations:
      required: true
  - type: input
    id: license-url
    attributes:
      label: Direct canonical license URL
      placeholder: https://raw.githubusercontent.com/owner/repo/main/LICENSE
    validations:
      required: true
  - type: textarea
    id: assets
    attributes:
      label: Asset, font, brand, and attribution notes
      description: Identify bundled material whose license or trademark policy may differ from the repository-level license.
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Suggested discovery tags
      placeholder: academic, research, light, data-storytelling
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification already performed
      description: State exactly what environment and commands were tested. “It should work” is not verification.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: The template is reusable beyond one presentation, customer, event, or private organization.
          required: true
        - label: The canonical source and repository-level license are publicly inspectable.
          required: true
        - label: I disclosed known asset, font, branding, and attribution caveats.
          required: true
        - label: A new user can follow the documented setup without private files or services.
          required: true
        - label: I searched existing entries and submissions for duplicates.
          required: true

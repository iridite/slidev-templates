name: Registry Health

on:
  workflow_dispatch:
  push:
    paths:
      - 'registry/**'
      - 'templates/**/LICENSE'
      - 'scripts/check-registry-health.mjs'
      - '.github/workflows/registry-health.yml'
  pull_request:
    paths:
      - 'registry/**'
      - 'templates/**/LICENSE'
      - 'scripts/check-registry-health.mjs'
      - '.github/workflows/registry-health.yml'
  schedule:
    - cron: '17 4 * * 0'

permissions:
  contents: read

concurrency:
  group: registry-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Check canonical sources, previews, and license evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run registry:health

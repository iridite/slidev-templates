name: Apply Registry v2 payload

on:
  push:
    branches:
      - feat/registry-v2-hosted-ecosystem
    paths:
      - '.github/workflows/apply-registry-v2.yml'

permissions:
  contents: write

concurrency:
  group: apply-registry-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/registry-v2-hosted-ecosystem

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          part = Path('.registry-v2-payload/part-04')
          content = part.read_text(encoding='utf-8')
          needle = 'B7bhekkXL'
          replacement = 'B7b8hekkXL'
          if content.count(needle) != 1:
              raise SystemExit('staged payload did not match the single known transport omission')
          part.write_text(content.replace(needle, replacement, 1), encoding='utf-8')
          PY
          cat .registry-v2-payload/part-* > /tmp/registry-v2.tar.xz.b64
          base64 --decode /tmp/registry-v2.tar.xz.b64 > /tmp/registry-v2.tar.xz
          echo "d90121fa83fb9ac0905a0029f079d46502a10bd6a505bfb9f15815e70dd14353  /tmp/registry-v2.tar.xz" | sha256sum --check -

      - name: Apply repository update
        shell: bash
        run: |
          tar -xJf /tmp/registry-v2.tar.xz
          rm -rf .registry-v2-payload
          rm -f .github/workflows/apply-registry-v2.yml

      - name: Commit exact payload
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: evolve collection into a verified Slidev template registry"
          git push origin HEAD:feat/registry-v2-hosted-ecosystem
